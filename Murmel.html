<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E3841">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Murmel">
<title>Murmel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25' r='75%25'%3E%3Cstop offset='0' stop-color='%23FFD98A'/%3E%3Cstop offset='.5' stop-color='%23DE8F17'/%3E%3Cstop offset='1' stop-color='%238A4F05'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%232E3841'/%3E%3Ccircle cx='50' cy='50' r='34' fill='url(%23g)'/%3E%3Cellipse cx='39' cy='36' rx='11' ry='7' fill='%23fff' opacity='.5' transform='rotate(-28 39 36)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="ati">
<style>
:root{
  /* Sprinklr palette. Space Gray base and its shades, primaries for hierarchy, Ocean Blue for UI buttons. */
  --bg:#262F37; --deep:#1C2329; --s1:#313B44; --s2:#3B4651; --s3:#4A5663; --line:rgba(255,255,255,.08);
  --tx:#F1F1F1; --mu:#A0A0A8; --mu2:#7F8893;
  --push:#E0277F; --pull:#00BAE9; --legs:#70BF54; --amber:#FAA21B; --bad:#E0277F;
  --da:#70BF54; --db:#00BAE9; --dc:#AA519F; --dd:#C9D036;
  --btn:#118ACB; --btn-h:#0071B1; --btn-p:#005798;
  --acc:var(--amber);
  --r0:28px; --r1:22px; --r2:16px; --r3:12px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
  font-family:"Montserrat","Proxima Nova",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);min-height:100%}
body{font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:active{transform:scale(.97)}
button{transition:transform .12s var(--ease),background .2s}
:focus-visible{outline:2px solid var(--pull);outline-offset:2px;border-radius:8px}
#app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 16px) 14px calc(var(--safe-b) + 110px)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.08}
h2{font-size:19px;line-height:1.2}
h3{font-size:15px}
p{margin:0}
.mu{color:var(--mu)} .sm{font-size:13px} .xs{font-size:11.5px}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.num{font-weight:800;letter-spacing:-.02em;line-height:1}
.eyebrow{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--mu)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.sec{margin-top:26px}
.sec>h2{margin-bottom:10px}
.panel{background:var(--s1);border-radius:var(--r1);padding:16px}
.tile{background:var(--s1);border-radius:var(--r2);padding:12px 14px}
.list{background:var(--s1);border-radius:var(--r1);padding:2px 14px}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list>.li:last-child{border-bottom:0}
.li .t{font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.c-push{color:var(--push)} .c-pull{color:var(--pull)} .c-legs{color:var(--legs)} .c-amber{color:var(--amber)}
.bg-push{background:var(--push)} .bg-pull{background:var(--pull)} .bg-legs{background:var(--legs)} .bg-amber{background:var(--amber)}
.c-da{color:var(--da)} .c-db{color:var(--db)} .c-dc{color:var(--dc)} .c-dd{color:var(--dd)}
.bg-da{background:var(--da)} .bg-db{background:var(--db)} .bg-dc{background:var(--dc)} .bg-dd{background:var(--dd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;background:var(--s2);font-weight:700}
.btn.pri{background:var(--btn);color:#fff}
.btn.pri:active{background:var(--btn-p)}
@media (hover:hover){.btn.pri:hover{background:var(--btn-h)}}
.btn.wide{width:100%}
.btn.ghost{background:rgba(255,255,255,.06)}
.btn.danger{background:rgba(224,39,127,.12);color:#FF7DB8}
.btn:disabled{opacity:.4}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.07);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--deep)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv{background:var(--s1);border-radius:var(--r2);padding:12px}
.kv .v{font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.kv .k{font-size:12px;color:var(--mu);margin-top:3px}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .6s var(--ease)}
input.f,select.f,textarea.f{width:100%;background:rgba(255,255,255,.06);border:1px solid transparent;border-radius:var(--r3);padding:12px 13px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--pull)}
label.lb{display:block;font-size:12px;color:var(--mu);margin:12px 0 6px;font-weight:600}
.note{border-radius:var(--r2);padding:12px 14px;background:var(--s1);font-size:14px;position:relative;padding-left:18px}
.note::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--acc)}
.note.push::before{background:var(--push)} .note.pull::before{background:var(--pull)} .note.legs::before{background:var(--legs)} .note.amber::before{background:var(--amber)}
.seg{display:flex;background:var(--s1);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;padding:9px 4px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mu)}
.seg button.on{background:var(--s3);color:var(--tx)}
.swatch{width:14px;height:14px;border-radius:50%;display:inline-block}
hr.sp{border:0;height:1px;background:var(--line);margin:18px 0}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--tx);flex:none;background:rgba(255,255,255,.06)}
.iconbtn.plain{background:none;color:var(--mu)}
.iconbtn svg{width:20px;height:20px}

/* ---------- floating glass tab bar ---------- */
#tabs{position:fixed;left:14px;right:14px;bottom:calc(var(--safe-b) + 12px);z-index:20;max-width:420px;margin:0 auto;border-radius:30px;background:rgba(49,59,68,.72);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 40px rgba(0,0,0,.35)}
#tabs .in{display:flex;padding:6px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10.5px;color:var(--mu2);font-weight:700;border-radius:24px}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--tx);background:rgba(255,255,255,.09)}
#resume{position:fixed;left:14px;right:14px;bottom:calc(var(--safe-b) + 82px);z-index:21;max-width:420px;margin:0 auto;display:none}
#resume.show{display:flex}
#resume button{flex:1;display:flex;align-items:center;gap:12px;background:var(--btn);color:#fff;border-radius:22px;padding:13px 16px;font-weight:800;box-shadow:0 12px 30px rgba(17,138,203,.35)}

/* ---------- bento ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{position:relative;overflow:hidden;border-radius:var(--r0);background:var(--s1);padding:16px;min-height:148px;text-align:left;display:flex;flex-direction:column}
.b.w2{grid-column:span 2}
.b.short{min-height:0}
.b .lbl{font-size:12px;font-weight:700;color:var(--mu);display:flex;align-items:center;gap:6px}
.b .lbl svg{width:15px;height:15px}
.b .foot{margin-top:auto}
.hero{min-height:250px;padding:20px;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--dcol) 38%,transparent),transparent 62%),var(--s1)}
.hero .letter{position:absolute;right:-8px;top:-34px;font-size:230px;font-weight:800;line-height:1;letter-spacing:-.06em;background:linear-gradient(170deg,var(--dcol),color-mix(in srgb,var(--dcol) 10%,transparent) 80%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.9;pointer-events:none;user-select:none}
.hero .ttl{font-size:36px;font-weight:800;line-height:1;margin-top:8px;letter-spacing:-.02em}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero .meta span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.18)}
.hero .acts{display:flex;gap:8px;margin-top:auto;padding-top:18px;align-items:center}
.ring{position:relative;display:inline-grid;place-items:center}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.wdots{display:flex;gap:5px;margin-top:10px}
.wdots i{flex:1;height:22px;border-radius:7px;background:rgba(255,255,255,.07);display:block}
.wdots i.t{outline:1.5px solid var(--mu2);outline-offset:1px}
.spark{width:100%;height:46px;display:block}
.marble{width:132px;height:132px;position:relative}
.marble svg{width:100%;height:100%;overflow:visible}
.marble.sm{width:86px;height:86px}
.marble.lg{width:200px;height:200px;margin:0 auto}
.marble .spin{transform-origin:50% 50%;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{animation:pop .5s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}

/* ---------- focus mode (training) ---------- */
#sess{position:fixed;inset:0;z-index:30;background:var(--deep);display:none;flex-direction:column}
#sess.show{display:flex}
.fx-top{padding:calc(var(--safe-t) + 10px) 14px 8px;max-width:560px;width:100%;margin:0 auto}
.fx-prog{display:flex;gap:4px;margin-bottom:10px}
.fx-prog button{flex:1;height:20px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative;padding:8px 0;background-clip:content-box}
.fx-prog button i{position:absolute;left:0;top:8px;height:4px;border-radius:4px;background:var(--tx)}
.fx-prog button.cur{background-color:rgba(255,255,255,.28)}
.fx-track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.fx-track::-webkit-scrollbar{display:none}
.fx-card{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fx-in{max-width:560px;margin:0 auto;padding:6px 16px 30px}
.fx-name{font-size:30px;font-weight:800;line-height:1.08;letter-spacing:-.02em;margin-top:6px}
.fx-why{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.06);line-height:1.35}
.fx-why.up{background:rgba(112,191,84,.16);color:#A6E08E} .fx-why.down,.fx-why.hold{background:rgba(250,162,27,.14);color:#FFC768}
.fx-ex+.fx-ex{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.fx-sub{font-size:13px;color:var(--mu);margin-top:6px}
.sets{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center;padding:7px;border-radius:20px;background:var(--s1);transition:background .25s}
.set.next{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.set.done{background:color-mix(in srgb,var(--s1) 70%,var(--da) 24%)}
.set.warm{background:rgba(255,255,255,.04)}
.set.warm .no{color:var(--amber)}
.set .no{font-size:13px;color:var(--mu2);text-align:center;font-weight:700}
.step{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;background:rgba(255,255,255,.06);border-radius:14px;height:52px;min-width:0}
.step button{height:52px;font-size:22px;color:var(--mu);font-weight:500}
.step .u{position:relative;height:52px}
.step input{width:100%;min-width:0;height:52px;background:none;border:0;text-align:center;font-size:20px;font-weight:800;outline:none;padding:0 0 13px;-moz-appearance:textfield}
.step .u small{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;color:var(--mu2);pointer-events:none;font-weight:600}
.ok{width:52px;height:52px;border-radius:50%;border:2px solid var(--s3);display:flex;align-items:center;justify-content:center}
.set.done .ok{background:var(--da);border-color:var(--da);color:var(--deep)}
.ok svg{width:24px;height:24px}
.effort{display:flex;gap:8px;margin-top:14px}
.effort button{flex:1;padding:12px 6px;border-radius:16px;background:var(--s1);font-weight:700;font-size:14px}
.effort button.on{background:var(--tx);color:var(--deep)}
.fx-dock{padding:10px 14px calc(var(--safe-b) + 12px);max-width:560px;width:100%;margin:0 auto}
.dockbtn{width:100%;min-height:62px;border-radius:22px;background:var(--btn);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;flex-direction:column;line-height:1.15}
.dockbtn small{font-size:12px;font-weight:600;opacity:.85}
.dockbtn.alt{background:var(--s2)}
.restdock{display:flex;align-items:center;gap:8px;background:var(--tx);color:var(--deep);border-radius:22px;padding:10px 12px;min-height:62px}
.restdock.plank{background:var(--amber)}
.restdock .tv{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
.restdock button{background:rgba(38,47,55,.1);border-radius:999px;padding:9px 11px;font-weight:800;font-size:14px}
.timer{display:none}

/* ---------- sheets & overlays ---------- */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:var(--s1);border-radius:30px 30px 0 0;padding:10px 18px calc(var(--safe-b) + 22px);max-width:560px;margin:0 auto;animation:up .3s var(--ease)}
#sheet .pane .list{background:var(--s2)}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--s3);margin:2px auto 14px}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translateX(-50%) translateY(calc(-100% - 60px));z-index:80;background:var(--tx);color:var(--deep);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .35s var(--ease);max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
#over{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;overflow-y:auto}
#over.show{display:block}
#over .body{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 20px) 16px calc(var(--safe-b) + 30px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
body.insess{overflow:hidden}

/* ---------- story recap ---------- */
.story{position:fixed;inset:0;z-index:75;background:var(--deep);display:none;flex-direction:column}
.story.show{display:flex}
.story .bars{display:flex;gap:4px;padding:calc(var(--safe-t) + 10px) 14px 0}
.story .bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.2)}
.story .bars i.on{background:var(--tx)}
.story .track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.story .track::-webkit-scrollbar{display:none}
.story .card{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;position:relative;overflow:hidden}
.story .card .glow{position:absolute;inset:-30%;background:radial-gradient(50% 40% at 70% 30%,color-mix(in srgb,var(--g) 40%,transparent),transparent 70%);pointer-events:none}
.story .card>*{position:relative}
.story .huge{font-size:min(92px,17vw);overflow-wrap:anywhere;font-weight:800;line-height:.95;letter-spacing:-.04em}
.story .x{position:absolute;right:14px;top:calc(var(--safe-t) + 22px);z-index:2}

/* ---------- guided treadmill ---------- */
.guide .inc{font-size:120px;font-weight:800;line-height:.9;letter-spacing:-.05em}
.segs{display:flex;gap:3px;margin-top:18px}
.segs i{height:8px;border-radius:4px;background:rgba(255,255,255,.12);display:block}
.segs i.d{background:var(--amber)} .segs i.c{background:var(--tx)}

/* ---------- charts, mastery, trophies, photos ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mu2);font-size:10px;font-family:inherit}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcell{background:var(--s1);border-radius:var(--r2);padding:11px 12px;text-align:left}
.mcell .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tier{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800}
.tier i{width:9px;height:9px;transform:rotate(45deg);border-radius:2px}
.troph{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.troph .tr{aspect-ratio:1;border-radius:20px;background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;padding:4px;text-align:center}
.troph .tr small{font-size:9.5px;color:var(--mu);margin-top:4px;line-height:1.15;font-weight:600}
.troph .tr.off{opacity:.25;filter:grayscale(1)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;background:var(--s1);padding:12px;border-radius:var(--r1)}
.heat i{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.06)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--s1);position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos small{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp img{width:100%;border-radius:16px;display:block;aspect-ratio:3/4;object-fit:cover;background:var(--s2)}
.bodymap{display:flex;justify-content:center;gap:18px}
.bodymap svg{height:240px;width:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.restdock .ring{display:none}.restdock button{padding:8px 9px}}

</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="resume"></div>
<nav id="tabs" aria-label="Navigation"></nav>
<section id="sess" aria-label="Training"></section>
<div id="story" class="story" role="dialog" aria-label="Monatsrückblick"></div>
<div id="guide" class="story" role="dialog" aria-label="Laufband"></div>

/* ===================== Schema migrations ===================== */
// Each migration upgrades from schema n to n+1. Never mutate older keys destructively.
const MIGRATIONS = [
  // 1 -> 2: PPL days replaced by full body A/B/C + bonus D, per-day set counts, comeback ramp.
  s => {
    const ex = defaultExercises();
    s.exercises = s.exercises || {};
    for (const k of Object.keys(ex)) if (!s.exercises[k]) s.exercises[k] = ex[k];
    s.days = defaultDays();
    if (s.settings) delete s.settings.cycleMode;
    s.ramp = { start: Date.now() };
    s.schema = 2;
  },
  // 2 -> 3: superset pair on D, new settings and stores (filled additively by migrate)
  s => {
    const d = s.days && s.days.d;
    if (Array.isArray(d)) d.forEach(x => { if (x && (x.id === 'ham' || x.id === 'tpd')) x.ss = 's1'; });
    s.schema = 3;
  },
];
function migrate(s) {
  const base = defaultState();
  if (!s || typeof s !== 'object') return base;
  s.schema = s.schema || 1;
  while (s.schema - 1 < MIGRATIONS.length) MIGRATIONS[s.schema - 1](s);
  // fill any missing top-level keys and settings additively
  for (const k of Object.keys(base)) if (s[k] === undefined) s[k] = base[k];
  for (const k of Object.keys(base.settings)) if (s.settings[k] === undefined) s.settings[k] = base.settings[k];
  for (const k of Object.keys(base.seen)) if (s.seen[k] === undefined) s.seen[k] = base.seen[k];
  for (const k of Object.keys(base.days)) if (!Array.isArray(s.days[k])) s.days[k] = base.days[k];
  for (const k of Object.keys(s.days)) s.days[k] = s.days[k].map(x => typeof x === 'string' ? { id: x, sets: (s.exercises[x] || {}).sets || 3 } : x);
  return s;
}

/* ===================== Storage (localStorage + IndexedDB mirror) ===================== */
let S = defaultState();
const IDB = {
  db: null,
  open() {
    return new Promise(res => {
      if (!('indexedDB' in window)) return res(null);
      try {
        const r = indexedDB.open('murmel', 2);
        r.onupgradeneeded = () => { const db = r.result; for (const n of ['kv', 'photos', 'snaps']) if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); };
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  get(k, st = 'kv') {
    return new Promise(res => {
      if (!this.db) return res(null);
      try { const q = this.db.transaction(st).objectStore(st).get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }
      catch (e) { res(null); }
    });
  },
  set(k, v, st = 'kv') {
    if (!this.db) return;
    try { this.db.transaction(st, 'readwrite').objectStore(st).put(v, k); } catch (e) { }
  },
  del(k, st = 'kv') { if (!this.db) return; try { this.db.transaction(st, 'readwrite').objectStore(st).delete(k); } catch (e) { } },
  keys(st) {
    return new Promise(res => {
      if (!this.db) return res([]);
      try { const q = this.db.transaction(st).objectStore(st).getAllKeys(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }
      catch (e) { res([]); }
    });
  },
};

/* ===================== Cycle engine ===================== */
function finished() { return S.sessions.filter(s => s.end).sort((a, b) => a.start - b.start); }
// Rolling A, B, C. A day done out of order jumps the pointer past it; D and legacy days never move it.
function cycleState(list) {
  const seq = MAIN_DAYS;
  let pos = 0, cycles = 0;
  for (const s of (list || finished())) {
    const i = seq.indexOf(s.day); if (i < 0) continue;
    pos = i + 1;
    if (pos >= seq.length) { pos = 0; cycles++; }
  }
  return { pos, seq, next: seq[pos], cycles };
}

/* ===================== Comeback ramp ===================== */
// Sessions 1-3 after the ramp start: 2 sets at about 70 %. Sessions 4-6: full sets at about 85 %. Then normal.
const RAMP = [{ f: .7, maxSets: 2 }, { f: .85, maxSets: 9 }];
function rampInfo(before) {
  const r = S.ramp; if (!r || !r.start) return { phase: 3 };
  const xs = finished().filter(s => s.start >= r.start && (!before || s.start < before));
  const n = xs.length;
  const phase = n < 3 ? 1 : n < 6 ? 2 : 3;
  return { phase, n, p2start: xs[3] ? xs[3].start : Infinity, left: phase === 1 ? 3 - n : phase === 2 ? 6 - n : 0 };
}
const roundInc = (v, inc) => Math.max(inc, Math.round(v / inc) * inc);

/* ===================== Exercise math ===================== */
const isTime = ex => ex && ex.kind === 't';
function e1rm(w, r, ex) {
  if (isTime(ex)) return r || 0;
  if (!w || !r) return 0;
  return w * (1 + Math.min(r, 20) / 30);
}
function doneSets(e) { return (e.sets || []).filter(x => x.done && (num(x.r) > 0)); }
function exHistory(exId, before, forSuggest) {
  const ex = S.exercises[exId], out = [];
  for (const s of finished()) {
    if (before && s.start >= before) continue;
    if (forSuggest && s.deload) continue;
    const e = s.ex.find(x => x.id === exId); if (!e) continue;
    const ds = doneSets(e); if (!ds.length) continue;
    const topW = Math.max(...ds.map(x => num(x.w) || 0));
    out.push({
      t: s.start, sid: s.id, effort: e.effort || 0, sets: ds.map(x => ({ w: num(x.w) || 0, r: num(x.r) || 0 })), topW,
      e1: Math.max(...ds.map(x => e1rm(num(x.w) || 0, num(x.r) || 0, ex))),
      vol: sum(ds.map(x => (num(x.w) || 0) * (num(x.r) || 0))),
    });
  }
  return out;
}
function hitMax(entry, ex, n) {
  n = n || ex.sets;
  const at = entry.sets.filter(x => x.w >= entry.topW);
  return entry.sets.length >= n && at.length >= n && at.every(x => x.r >= ex.max);
}

// Double progression: top of the range in two sessions in a row at the same weight => weight up.
function suggest(exId, before, planned) {
  const ex = S.exercises[exId]; if (!ex) return null;
  const base = suggestCore(exId, before, planned || ex.sets);
  const R = rampInfo(before);
  if (R.phase >= 3) {
    const DL = deloadInfo();
    if (!before && DL.active && !isTime(ex)) {
      const n = Math.max(1, Math.ceil((planned || ex.sets) / 2)), w = base.w > 0 ? snapW(ex, base.w * .9, 0) : base.w;
      base.sets = Array.from({ length: n }, (_, i) => ({ w, r: (base.sets[i] || base.sets[0]).r })); base.w = w; base.kind = 'down';
      base.why = 'Deload-Woche: ' + n + (n === 1 ? ' Satz' : ' Sätze') + ' bei etwa 90 %. Locker bleiben, nächste Woche geht es normal weiter.';
    }
    return base;
  }
  const P = RAMP[R.phase - 1], n = Math.min(planned || ex.sets, P.maxSets);
  base.sets = base.sets.slice(0, n);
  const h = exHistory(exId, before, true), last = h[h.length - 1];
  const tag = 'Comeback Woche ' + R.phase + ': ';
  if (!last) base.why = tag + 'etwa ' + Math.round(P.f * 100) + ' % deines alten Gewichts, ' + (R.phase === 1 ? '2 Sätze, hör 3 Wdh. vor dem Limit auf.' : 'volle Sätze, 2 Wdh. Reserve.');
  else if (R.phase === 2 && !isTime(ex) && last.t < R.p2start && last.topW > 0) {
    const w = Math.max(snapW(ex, last.topW * RAMP[1].f / RAMP[0].f, 1), nextW(ex, last.topW, 1));
    base.w = w; base.sets = base.sets.map(() => ({ w, r: ex.min })); base.kind = 'up';
    base.why = tag + 'von 70 auf etwa 85 %. ' + fmt(w, 2) + ' kg, ' + ex.min + ' bis ' + ex.max + ' Wdh.';
  } else base.why = tag + (R.phase === 1 ? 'locker bleiben, 3 Wdh. Reserve. ' : '') + base.why;
  return base;
}
function suggestCore(exId, before, n) {
  const ex = S.exercises[exId];
  const h = exHistory(exId, before, true);
  const mk = (w, reps, why, kind) => ({ w, sets: Array.from({ length: n }, (_, i) => ({ w, r: Array.isArray(reps) ? (reps[i] ?? reps[reps.length - 1]) : reps })), why, kind });
  if (!h.length) return mk(ex.startW || 0, isTime(ex) ? ex.min : ex.min, 'Erste Einheit: wähle ein Gewicht für ' + ex.min + ' bis ' + ex.max + ' saubere Wiederholungen.', 'new');
  const last = h[h.length - 1], prev = h[h.length - 2];
  if (isTime(ex)) {
    const lastMin = Math.min(...last.sets.map(x => x.r));
    const prevMin = prev ? Math.min(...prev.sets.map(x => x.r)) : 0;
    const target = (!prev || lastMin >= prevMin) ? lastMin + ex.inc : lastMin;
    return mk(0, target, target > lastMin ? 'Letztes Mal ' + lastMin + ' s gehalten. Heute ' + target + ' s.' : 'Halte wieder ' + target + ' s, bevor es länger wird.', target > lastMin ? 'up' : 'hold');
  }

  const twice = hitMax(last, ex, n) && prev && prev.topW === W && hitMax(prev, ex, n);
  if (twice && last.effort === 3)
    return mk(W, ex.max, 'Zweimal oben, aber zuletzt hart. Noch einmal festigen, dann ' + fmt(up, 2) + ' kg.', 'confirm');
  if (twice)
    return mk(up, ex.min, 'Zweimal alle Sätze bei ' + ex.max + '. Zeit für ' + fmt(up, 2) + ' kg.', 'up');
  if (hitMax(last, ex, n) && last.effort === 1)
    return mk(up, ex.min, 'Alle Sätze oben und es fühlte sich leicht an. Direkt hoch auf ' + fmt(up, 2) + ' kg.', 'up');
  if (hitMax(last, ex, n))
    return mk(W, ex.max, 'Alle Sätze bei ' + ex.max + ' geschafft. Noch einmal, dann geht das Gewicht hoch.', 'confirm');
  if (allBelowMin(last, ex) && prev && prev.topW === W && allBelowMin(prev, ex) && dn > 0 && dn < W)
    return mk(dn, ex.min, 'Zweimal unter ' + ex.min + ' Wdh. Einen Schritt leichter bringt dich zurück in den Bereich.', 'down');

    const s = last.sets.filter(x => x.w >= W)[i] || last.sets[i] || last.sets[last.sets.length - 1];

  });

}

      const d = ex[e.id]; if (!d) continue;
      setsPlanned += (e.sets || []).length;
      const ds = doneSets(e); if (!ds.length) continue;

      const e1 = Math.max(...ds.map(x => e1rm(num(x.w) || 0, num(x.r) || 0, d)));
      const v = sum(ds.map(x => (num(x.w) || 0) * (num(x.r) || 0)));

      if (base[e.id] === undefined) { base[e.id] = e1; best[e.id] = e1; tierNow[e.id] = 0; }
      else {
        if (e1 > best[e.id] + 1e-9) { prs++; prList.push(e.id); best[e.id] = e1; }
        if (!isTime(d) && lastTop[e.id] !== undefined && topW > lastTop[e.id]) progs++;

        if (t > tierNow[e.id]) { tierUps += t - tierNow[e.id]; tierList.push([e.id, t]); tierNow[e.id] = t; }

/* ===================== Weights on hand ===================== */
function weightOptions(ex) {
  if (!ex || isTime(ex)) return null;
  if (ex.equip === 'KH') { const a = (S.settings.dbW || []).map(Number).filter(v => v > 0).sort((x, y) => x - y); return a.length ? a : null; }
  if (ex.equip === 'Kabel') { const st = num(S.settings.cableStep) || 2.5, mx = num(S.settings.cableMax) || 100, a = []; for (let v = st; v <= mx + 1e-9; v = round(v + st, 2)) a.push(v); return a; }
  return null;
}
function nextW(ex, w, dir) {
  const o = weightOptions(ex);
  if (!o) return Math.max(0, round((w || 0) + dir * ex.inc, 2));
  if (dir > 0) return o.find(v => v > (w || 0) + 1e-9) ?? o[o.length - 1];
  const below = o.filter(v => v < (w || 0) - 1e-9); return below.length ? below[below.length - 1] : (w > o[0] ? o[0] : 0);

// dir 0 = nearest, 1 = at or above, -1 = at or below
function snapW(ex, w, dir) {
  const o = weightOptions(ex);
  if (!o) return Math.max(0, round(Math.round(w / ex.inc) * ex.inc, 2));
  if (dir > 0) return o.find(v => v >= w - 1e-9) ?? o[o.length - 1];

let AC = null;
function beep(f = 880, d = 0.12, vol = 0.18) {
  if (!S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = f; o.type = 'sine'; g.gain.value = vol;
    o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.start(); o.stop(AC.currentTime + d + 0.02);
  } catch (e) { }
}
function chime() { beep(660, .12); setTimeout(() => beep(880, .12), 130); setTimeout(() => beep(1320, .2), 260); }
function buzz(p = 15) { if (S.settings.haptics && navigator.vibrate) try { navigator.vibrate(p); } catch (e) { } }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#F07A63', '#63B3F0', '#86D08E', '#F2C14E', '#EDE8DF'];
  const P = Array.from({ length: 110 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 11, vy: -Math.random() * 12 - 3, r: Math.random() * 6 + 3, c: cols[Math.random() * 5 | 0], a: Math.random() * 6 }));
  let f = 0; (function tick() {
    x.clearRect(0, 0, c.width, c.height);
    for (const p of P) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; x.fillStyle = p.c; x.beginPath(); x.ellipse(p.x, p.y, p.r, p.r * .55, p.a, 0, 7); x.fill(); }
    if (++f < 140) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
  })();
}

/* ===================== Charts ===================== */
function lineChart(series, o = {}) {
  const Wd = 340, H = o.h || 150, P = { l: 30, r: 8, t: 10, b: 20 };
  const all = series.flatMap(s => s.pts); if (all.length < 2) return '<p class="mu sm">Noch zu wenig Daten für eine Kurve.</p>';
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let y0 = Math.min(...all.map(p => p[1]), ...(o.extraY || [])), y1 = Math.max(...all.map(p => p[1]), ...(o.extraY || []));
  if (x1 === x0) x1 = x0 + 1; const pad = (y1 - y0) * .12 || 1; y0 -= pad; y1 += pad;
  const X = v => P.l + (v - x0) / (x1 - x0) * (Wd - P.l - P.r), Y = v => H - P.b - (v - y0) / (y1 - y0) * (H - P.t - P.b);
  const grid = [0, .5, 1].map(f => { const v = y0 + (y1 - y0) * f; return `<line x1="${P.l}" x2="${Wd - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 5}" y="${Y(v) + 3}" text-anchor="end">${fmt(v, o.yd ?? 0)}</text>`; }).join('');
  const goal = o.goal != null ? `<line x1="${P.l}" x2="${Wd - P.r}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="var(--amber)" stroke-dasharray="4 4" stroke-width="1.2"/>` : '';
  const lines = series.map(s => {
    if (!s.pts.length) return '';
    const d = s.pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
    const dots = s.dots ? s.pts.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.6" fill="${s.color}"/>`).join('') : '';
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" ${s.dash ? 'stroke-dasharray="3 4"' : ''} stroke-linejoin="round" stroke-linecap="round" opacity="${s.op || 1}"/>${dots}`;
  }).join('');
  const xl = `<text x="${P.l}" y="${H - 4}">${fmtDate(x0)}</text><text x="${Wd - P.r}" y="${H - 4}" text-anchor="end">${fmtDate(x1)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}">${grid}${goal}${lines}${xl}</svg>`;
}
function barChart(bars, o = {}) {
  const Wd = 340, H = o.h || 120, P = { t: 8, b: 18 }; if (!bars.length) return '';

}

  if (pts.length < 2) return '';
  const W = 200, H = 46, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1, y0 = Math.min(...ys) - .2, y1 = Math.max(...ys) + .2;
  const X = v => (v - x0) / ((x1 - x0) || 1) * W, Y = v => H - 4 - (v - y0) / ((y1 - y0) || 1) * (H - 8);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d} L${W} ${H} L0 ${H}Z" fill="${color}" opacity=".08"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

/* ===================== Session (focus mode) ===================== */
let wakeLock = null;
async function lockScreen(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { }
}
function buildEx(id, before, planned, extra = {}) {
  const sg = suggest(id, before, planned), ex = S.exercises[id];
  return { id, n: sg.sets.length, sets: sg.sets.map(x => ({ w: x.w, r: x.r, done: false })), note: '', why: sg.why, kind: sg.kind, rest: ex.rest, ...extra };
}
function startSession(day, quick) {
  if (S.draft) { openSession(); return; }
  let es = dayEntries(day);
  if (quick) es = es.slice(0, 4);
  const deload = deloadInfo().active;
  const ex = es.map(x => buildEx(x.id, undefined, quick ? Math.min(2, x.sets) : x.sets, x.ss && !quick ? { ss: x.ss } : {}));
  if (quick) ex.forEach(e => e.rest = Math.round((e.rest || 90) * .75));
  if (ex[0]) { const d = S.exercises[ex[0].id]; ex[0].warm = warmups(d, num(ex[0].sets[0] && ex[0].sets[0].w)); }
  S.draft = { id: uid(), day, start: Date.now(), ex, quick: !!quick, deload };
  FX.cur = 0; save(); closeSheet(); openSession(); buzz(20);
}
function openSession() { document.body.classList.add('insess'); $('#sess').classList.add('show'); renderSession(); lockScreen(true); renderTabs(); }
function minimizeSession() { document.body.classList.remove('insess'); $('#sess').classList.remove('show'); lockScreen(false); render(); }
const FX = { cur: 0, cards: [] };
function groupsOf(d) {
  const g = [];
  d.ex.forEach((e, i) => { const l = g[g.length - 1]; if (e.ss && l && d.ex[l[0]].ss === e.ss) l.push(i); else g.push([i]); });
  return g;
}
let sessTick = null, scrollT = null;
function renderSession() {
  const d = S.draft; if (!d) return minimizeSession();
  const dm = DAYMETA[d.day] || { name: 'Training', col: 'amber' };
  FX.cards = groupsOf(d);
  FX.cur = clamp(FX.cur, 0, FX.cards.length);
  $('#sess').innerHTML = `
  <div class="fx-top"><div class="fx-prog" id="fxProg">${progHTML()}</div>
    <div class="row">
      <button class="iconbtn" data-act="minSess" aria-label="Minimieren">${icon('down')}</button>
      <div class="grow"><div style="font-weight:800;font-size:17px" class="c-${dm.col}">${d.editOf ? 'Bearbeiten: ' : ''}${dm.name}${d.quick ? ' <span class="chip" style="font-size:10px;padding:3px 8px">30 min</span>' : ''}${d.deload ? ' <span class="chip" style="font-size:10px;padding:3px 8px">Deload</span>' : ''}</div><div class="mu xs" id="sessClock">${d.editOf ? fmtDate(d.start, true) : fmtDur((Date.now() - d.start) / 1000)}</div></div>
      <button class="iconbtn" data-act="overview" aria-label="Übersicht">${icon('list')}</button>
      <button class="iconbtn" data-act="sessMenu" aria-label="Optionen">${icon('dots')}</button>
    </div></div>
  <div class="fx-track" id="track">${FX.cards.map((g, c) => `<section class="fx-card" id="card-${c}"><div class="fx-in">${cardHTML(c)}</div></section>`).join('')}<section class="fx-card" id="card-${FX.cards.length}"><div class="fx-in">${summaryHTML()}</div></section></div>
  <div class="fx-dock" id="dock"></div>`;
  const tr = $('#track');
  requestAnimationFrame(() => { tr.scrollLeft = FX.cur * tr.clientWidth; });
  tr.addEventListener('scroll', () => {
    clearTimeout(scrollT);
    scrollT = setTimeout(() => { const i = Math.round(tr.scrollLeft / tr.clientWidth); if (i !== FX.cur) { FX.cur = i; updateProg(); renderDock(); if (i === FX.cards.length) refreshSummary(); } }, 90);
  }, { passive: true });
  renderDock();
  clearInterval(sessTick);
  if (!d.editOf) sessTick = setInterval(() => { const c = $('#sessClock'); if (c && S.draft) c.textContent = fmtDur((Date.now() - S.draft.start) / 1000); else clearInterval(sessTick); }, 1000);
}
function progHTML() {
  const d = S.draft;
  return FX.cards.map((g, c) => { const tot = sum(g.map(i => d.ex[i].sets.length)), dn = sum(g.map(i => d.ex[i].sets.filter(s => s.done).length));
    return `<button data-act="go" data-c="${c}" class="${c === FX.cur ? 'cur' : ''}" aria-label="Übung ${c + 1}"><i style="width:${tot ? dn / tot * 100 : 0}%"></i></button>`; }).join('');
}
function updateProg() { const p = $('#fxProg'); if (p) p.innerHTML = progHTML(); }
function goCard(c) { const tr = $('#track'); if (!tr) return; c = clamp(c, 0, FX.cards.length); FX.cur = c; tr.scrollTo({ left: c * tr.clientWidth, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); updateProg(); renderDock(); if (c === FX.cards.length) refreshSummary(); }
function shortName(n) { return n.replace(/ (KH|Kabel)$/, ''); }
function lastSummary(id, before) {
  const h = exHistory(id, before); if (!h.length) return '';
  const l = h[h.length - 1], ex = S.exercises[id];
  return 'Letztes Mal ' + relDay(l.t) + ': ' + l.sets.map(s => isTime(ex) ? s.r + ' s' : fmt(s.w, 2) + '×' + s.r).join(', ') + (l.effort ? ', ' + ['', 'leicht', 'passt', 'hart'][l.effort] : '');
}
function nextOpen(c) {
  const d = S.draft, g = FX.cards[c]; if (!g) return null;
  for (const i of g) { const w = d.ex[i].warm || []; const j = w.findIndex(x => !x.done); if (j >= 0) return { i, j, warm: true }; }
  const rounds = Math.max(...g.map(i => d.ex[i].sets.length));
  for (let j = 0; j < rounds; j++) for (const i of g) { const s = d.ex[i].sets[j]; if (s && !s.done) return { i, j }; }
  return null;
}
function cardHTML(c) {

    <div class="sets">${e.sets.map((s, j) => setRow(ex, s, i, j, nx)).join('')}</div>

function stepper(f, v, i, j, unit, warm) {

/* ===================== Timer (rest + plank), drawn into the dock ===================== */
const Timer = {
  iv: null, mode: null, end: 0, start: 0, target: 0, ij: null, beeped: false, total: 0,
  rest(sec) { this.stop(true); this.mode = 'rest'; this.total = sec; this.end = Date.now() + sec * 1000; this.run(); },
  plank(i, j, target) { this.stop(true); this.mode = 'prep'; this.ij = [i, j]; this.target = target; this.end = Date.now() + 5000; this.beeped = false; this.lastSec = 6; this.run(); },
  run() { this.draw(); this.iv = setInterval(() => this.draw(), 200); },
  draw() {
    const now = Date.now(), dk = $('#sess.show #dock');
    const out = html => { if (dk) dk.innerHTML = html; };
    if (this.mode === 'rest') {
      const left = (this.end - now) / 1000;
      if (left <= 0) { beep(1046, .3, .25); buzz([60, 60, 60]); this.stop(); return; }
      if (left <= 3.2 && Math.ceil(left) !== this.lastSec) { this.lastSec = Math.ceil(left); beep(660, .06, .1); }
      out(`<div class="restdock"><div class="ring">${ringSVG(left / this.total, 'var(--btn)', 34, 4, 'rgba(38,47,55,.12)')}</div><span class="tv">${fmtDur(left)}</span><button data-act="tAdd" data-d="-15">−15</button><button data-act="tAdd" data-d="15">+15</button><button data-act="tStop">Weiter</button></div>`);
      const r = $('#resume button span.grow'); if (r) r.textContent = 'Pause ' + fmtDur(left);
    } else if (this.mode === 'prep') {
      const left = Math.ceil((this.end - now) / 1000);
      if (left !== this.lastSec) { this.lastSec = left; if (left > 0) beep(660, .08); }
      if (now >= this.end) { beep(1046, .25); buzz(60); this.mode = 'hold'; this.start = now; }
      out(`<div class="restdock plank"><span class="tv">${Math.max(0, left)}</span><span class="grow" style="font-weight:800">Gleich geht's los</span><button data-act="tCancel">Abbrechen</button></div>`);
    } else if (this.mode === 'hold') {
      const held = (now - this.start) / 1000;
      if (!this.beeped && held >= this.target) { this.beeped = true; chime(); buzz([80, 60, 80]); }
      out(`<div class="restdock plank"><span class="tv">${Math.floor(held)}<small style="font-size:16px"> s</small></span><span class="grow sm" style="font-weight:800">${held >= this.target ? 'Ziel erreicht, halte weiter' : 'Ziel ' + this.target + ' s'}</span><button data-act="tHold">Stopp</button></div>`);
    }
  },
  stop(silent) { clearInterval(this.iv); this.iv = null; this.mode = null; if (!silent) { renderDock(); renderTabs(); } },
};

/* ===================== Progress photos (IndexedDB, device only) ===================== */
const Photos = {
  urls: {},
  async add() {
    const f = await pickFile('image/*'); if (!f) return;
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
      const sc = Math.min(1, 1080 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', .82));
      const id = 'p' + uid(); IDB.set(id, blob, 'photos');
      S.photos.push({ id, t: Date.now() }); save({ noSync: true }); render(); toast('Foto gespeichert');
    } catch (e) { toast('Das Bild konnte nicht gelesen werden'); }
  },
  async url(id) { if (this.urls[id]) return this.urls[id]; const b = await IDB.get(id, 'photos'); if (!b) return ''; return (this.urls[id] = URL.createObjectURL(b)); },
  async hydrate() { for (const img of $$('img[data-photo]')) img.src = await this.url(img.dataset.photo); },
  del(id) { IDB.del(id, 'photos'); S.photos = S.photos.filter(p => p.id !== id); if (this.urls[id]) URL.revokeObjectURL(this.urls[id]); delete this.urls[id]; save({ noSync: true }); },
  compare() {
    const ph = S.photos.slice().sort((a, b) => a.t - b.t); if (ph.length < 2) return;
    const a = ph[0], b = ph[ph.length - 1], days = daysBetween(a.t, b.t);
    sheet(`<h2>Vorher und jetzt</h2><p class="mu sm" style="margin-top:4px">${days} Tage dazwischen</p><div class="cmp" style="margin-top:12px"><div><img data-photo="${a.id}" alt="Erstes Foto"><p class="mu xs" style="margin-top:4px">${fmtDate(a.t, true)}</p></div><div><img data-photo="${b.id}" alt="Neuestes Foto"><p class="mu xs" style="margin-top:4px">${fmtDate(b.t, true)}</p></div></div>`);
    this.hydrate();
  },
};

/* ===================== Calendar export (.ics) ===================== */
function exportIcs() {
  const st = S.settings, days = (st.calDays || []).slice().sort();
  if (!days.length) return toast('Wähle mindestens einen Wochentag');
  const [hh, mm] = (st.calTime || '18:30').split(':').map(Number);
  const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  const d = new Date(); d.setHours(hh, mm, 0, 0);
  while (!days.includes(d.getDay()) || d.getTime() < Date.now()) d.setDate(d.getDate() + 1);
  const f = t => { const x = new Date(t); return x.getFullYear() + pad(x.getMonth() + 1) + pad(x.getDate()) + 'T' + pad(x.getHours()) + pad(x.getMinutes()) + '00'; };
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Murmel//DE', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT', 'UID:murmel-training-' + uid() + '@murmel', 'DTSTAMP:' + stamp,
    'DTSTART:' + f(d.getTime()), 'DTEND:' + f(d.getTime() + 60 * 60000), 'RRULE:FREQ=WEEKLY;BYDAY=' + days.map(x => BY[x]).join(','),
    'SUMMARY:Murmel Training', 'DESCRIPTION:Ganzkörper A\\, B\\, C rollierend. Öffne Murmel für den nächsten Tag.',
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Gleich Training', 'TRIGGER:-PT30M', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  download('murmel-training.ics', ics, 'text/calendar');
  toast('Kalender-Datei erstellt');
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ===================== CSV export ===================== */
const csvCell = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csvNum = v => v == null || v === '' ? '' : String(v).replace('.', ',');
function csvTraining() {
  const rows = [['Datum', 'Uhrzeit', 'Tag', 'Übung', 'Muskel', 'Satz', 'Gewicht kg', 'Wdh oder Sek', 'Erledigt', 'Gefühl', 'Kurzversion', 'Deload']];
  for (const s of finished()) for (const e of s.ex) { const ex = S.exercises[e.id] || { name: e.id, muscle: '' }; e.sets.forEach((x, j) => rows.push([dayKey(s.start), fmtTime(s.start), (DAYMETA[s.day] || { name: s.day }).name, ex.name, ex.muscle, j + 1, csvNum(x.w), x.r, x.done ? 'ja' : 'nein', ['', 'leicht', 'passt', 'hart'][e.effort || 0], s.quick ? 'ja' : '', s.deload ? 'ja' : ''])); }
  download('murmel-training-' + dayKey(Date.now()) + '.csv', '\uFEFF' + rows.map(r => r.map(csvCell).join(';')).join('\n'), 'text/csv');
}
function csvBody() {
  const days = {};
  const put = (t, k, v) => { const d = dayKey(t); (days[d] = days[d] || {})[k] = v; };
  S.body.forEach(b => { put(b.t, 'w', b.w); if (b.fat) put(b.t, 'fat', b.fat); });
  S.waist.forEach(w => put(w.t, 'waist', w.cm));
  S.recovery.forEach(r => { put(r.t, 'rec', r.score); if (r.hrv) put(r.t, 'hrv', r.hrv); if (r.sleep) put(r.t, 'sleep', r.sleep); });
  Object.entries(S.protein).forEach(([k, v]) => put(fromKey(k), 'prot', v));
  S.cardio.forEach(c => put(c.t, 'cardio', 'Session ' + c.kind + ' ' + c.min + ' min'));
  const rows = [['Datum', 'Gewicht kg', 'Körperfett %', 'Taille cm', 'Erholung', 'HRV ms', 'Schlaf', 'Protein g', 'Laufband']];
  Object.keys(days).sort().forEach(d => { const x = days[d]; rows.push([d, csvNum(x.w), csvNum(x.fat), csvNum(x.waist), x.rec, x.hrv, x.sleep, x.prot, x.cardio]); });
  download('murmel-koerper-' + dayKey(Date.now()) + '.csv', '\uFEFF' + rows.map(r => r.map(csvCell).join(';')).join('\n'), 'text/csv');
}

/* ===================== Automatic backups ===================== */
const Backup = {
  async daily() {
    const k = 'snap:' + dayKey(Date.now()), keys = (await IDB.keys('snaps')).filter(x => String(x).startsWith('snap:')).sort();
    if (!S.sessions.length && !S.body.length) return;
    if (!keys.includes(k)) IDB.set(k, JSON.stringify({ ...S, draft: null }), 'snaps');
    const all = keys.includes(k) ? keys : keys.concat(k);
    all.slice(0, Math.max(0, all.length - 7)).forEach(x => IDB.del(x, 'snaps'));
  },
  async listInto(sel) {
    const el = $(sel); if (!el) return;
    const keys = (await IDB.keys('snaps')).filter(x => String(x).startsWith('snap:')).sort().reverse();
    el.innerHTML = keys.length ? `<div class="list" style="background:var(--s2)">${keys.map(k => `<div class="li"><span class="grow">${fmtDate(fromKey(k.slice(5)), true)}</span><button class="chip" data-act="askRestore" data-k="${k}">Wiederherstellen</button></div>`).join('')}</div>` : 'Noch keine. Murmel legt jeden Tag automatisch eine an und behält die letzten 7.';
  },
  async restore(k) {
    const raw = await IDB.get(k, 'snaps'); if (!raw) return toast('Sicherung nicht gefunden');
    S = migrate(JSON.parse(raw)); S.updatedAt = Date.now(); _Astamp = -1; save(); closeSheet(); closeOverlay(); toast('Stand vom ' + fmtDate(fromKey(k.slice(5)), true) + ' geladen');
  },
};

/* ===================== Guided treadmill ===================== */
const TREAD = {
  A: [{ min: 5, incl: 3, sp: 5.0, t: 'Aufwärmen' }, { min: 15, incl: 5.5, sp: 5.5, t: 'Bergauf, gleichmäßig' }, { min: 5, incl: 2, sp: 4.5, t: 'Auslaufen' }],
  B: [{ min: 5, incl: 3, sp: 5.0, t: 'Aufwärmen' }, ...Array.from({ length: 5 }, () => [{ min: 2, incl: 10, sp: 5.0, t: 'Steil' }, { min: 2, incl: 8, sp: 5.3, t: 'Etwas flacher' }]).flat(), { min: 3, incl: 2, sp: 4.5, t: 'Auslaufen' }],
};
const Guide = {
  kind: 'A', start: 0, paused: 0, pauseAt: 0, iv: null, lastSeg: -1, lastCount: 99,
  open(kind) {
    this.kind = kind; this.start = 0; this.paused = 0; this.pauseAt = 0; this.lastSeg = -1;
    $('#guide').classList.add('show'); document.body.classList.add('insess'); this.draw();
  },
  plan() { return TREAD[this.kind]; },
  elapsed() { if (!this.start) return 0; return ((this.pauseAt || Date.now()) - this.start - this.paused) / 1000; },
  go() { if (!this.start) this.start = Date.now(); else if (this.pauseAt) { this.paused += Date.now() - this.pauseAt; this.pauseAt = 0; } clearInterval(this.iv); this.iv = setInterval(() => this.draw(), 250); lockScreen(true); beep(880, .12); this.draw(); },
  pause() { this.pauseAt = Date.now(); clearInterval(this.iv); this.draw(); },
  close(log) {
    clearInterval(this.iv); const el = this.elapsed();
    if (log && el >= 300) {
      const segs = this.plan(); let acc = 0, w = 0; for (const s of segs) { const d = Math.min(s.min * 60, Math.max(0, el - acc)); w += d * s.incl; acc += s.min * 60; }
      S.cardio.push({ id: uid(), t: Date.now(), kind: this.kind, min: Math.round(el / 60), incl: round(w / el, 1), guided: true }); save();
      toast('Laufband gespeichert, +15 Glanz'); confetti();
    } else if (log) toast('Unter 5 Minuten, nichts gespeichert');
    $('#guide').classList.remove('show'); document.body.classList.remove('insess'); lockScreen(false); render();
  },
  draw() {
    const segs = this.plan(), tot = sum(segs.map(s => s.min * 60)), el = this.elapsed();
    let acc = 0, i = 0; for (; i < segs.length; i++) { if (el < acc + segs[i].min * 60) break; acc += segs[i].min * 60; }
    const done = el >= tot, cur = segs[Math.min(i, segs.length - 1)], left = done ? 0 : acc + cur.min * 60 - el, nxt = segs[i + 1];
    if (this.start && !this.pauseAt) {
      if (i !== this.lastSeg && this.lastSeg >= 0) { chime(); buzz([60, 40, 60]); }
      this.lastSeg = i;

/* ===================== Google Drive sync ===================== */
const Sync = {
  token: null, exp: 0, gisP: null, fileId: null, t: null, busy: false, FILE: 'murmel-v5.json',
  loadGis() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    return this.gisP || (this.gisP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.onload = res; s.onerror = () => rej(new Error('Google-Skript konnte nicht geladen werden')); document.head.appendChild(s); }));
  },
  valid() { return this.token && Date.now() < this.exp - 60000; },
  async auth(interactive) {
    if (this.valid()) return this.token;
    if (!interactive) return null;
    if (!S.settings.driveClientId) throw new Error('Bitte zuerst eine Client-ID eintragen');
    await this.loadGis();
    return new Promise((res, rej) => {
      const c = google.accounts.oauth2.initTokenClient({
        client_id: S.settings.driveClientId.trim(), scope: 'https://www.googleapis.com/auth/drive.appdata',
        callback: r => { if (r.error) return rej(new Error(r.error)); this.token = r.access_token; this.exp = Date.now() + (r.expires_in || 3600) * 1000; res(this.token); },
        error_callback: e => rej(new Error(e && e.type === 'popup_closed' ? 'Anmeldung abgebrochen' : 'Anmeldung fehlgeschlagen')),
      });
      c.requestAccessToken({ prompt: '' });
    });
  },
  async api(url, opt = {}) {
    const r = await fetch(url, { ...opt, headers: { Authorization: 'Bearer ' + this.token, ...(opt.headers || {}) } });
    if (!r.ok) throw new Error('Drive-Fehler ' + r.status);
    return r;
  },
  async findFile() {
    if (this.fileId) return this.fileId;
    const q = encodeURIComponent("name='" + this.FILE + "'");
    const r = await (await this.api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q=' + q)).json();
    this.fileId = r.files && r.files[0] ? r.files[0].id : null; return this.fileId;
  },
  async pull() { const id = await this.findFile(); if (!id) return null; return (await this.api('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media')).json(); },
  async push() {
    const body = JSON.stringify({ ...S, draft: null, photos: [] });
    const id = await this.findFile();
    if (id) await this.api('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
    else {
      const b = 'murmel' + Date.now(), meta = JSON.stringify({ name: this.FILE, parents: ['appDataFolder'] });
      const mp = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
      const r = await (await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: mp })).json();
      this.fileId = r.id;
    }
  },
  // Last write wins, with a conflict prompt when both sides changed since the last sync.
  async now(interactive) {
    if (this.busy) return; this.busy = true;
    try {
      if (!(await this.auth(interactive))) return;
      const remote = await this.pull(), last = S.settings.lastSync || 0;
      if (remote && remote.updatedAt > S.updatedAt) {
        const localChanged = S.updatedAt > last;
        if (localChanged && interactive) { this.busy = false; return confirmSheet('Auf beiden Geräten gibt es neue Änderungen. Welchen Stand behalten?', 'Drive-Stand laden', 'syncAdopt'); }
        if (!localChanged) { this.adopt(remote); toast('Neuer Stand aus Drive geladen'); return; }
      }
      if (!remote || S.updatedAt > remote.updatedAt) await this.push();
      await this.dailyBackup().catch(() => { });
      S.settings.lastSync = Date.now(); save({ keepStamp: true, noSync: true });
      if (interactive) toast('Synchronisiert');
    } catch (e) { if (interactive) toast(e.message || 'Sync fehlgeschlagen'); }
    finally { this.busy = false; const i = $('#syncInfo'); if (i && S.settings.lastSync) i.textContent = 'Zuletzt synchronisiert ' + relDay(S.settings.lastSync) + ' um ' + fmtTime(S.settings.lastSync); }
  },
  async dailyBackup() {
    const today = dayKey(Date.now()); if (S.settings.lastDriveBackup === today) return;
    const name = 'murmel-backup-' + today + '.json', b = 'mb' + Date.now();
    const mp = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name, parents: ['appDataFolder'] })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({ ...S, draft: null, photos: [] })}\r\n--${b}--`;
    await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: mp });
    const q = encodeURIComponent("name contains 'murmel-backup-'");
    const r = await (await this.api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&pageSize=100&q=' + q)).json();
    const old = (r.files || []).sort((x, y) => x.name.localeCompare(y.name)).slice(0, -7);
    for (const f of old) await this.api('https://www.googleapis.com/drive/v3/files/' + f.id, { method: 'DELETE' }).catch(() => { });
    S.settings.lastDriveBackup = today;
  },
  adopt(remote) {
    const draft = S.draft, keep = { driveClientId: S.settings.driveClientId }, photos = S.photos;
    S = migrate(remote); S.draft = draft || null; S.photos = photos; Object.assign(S.settings, keep); S.settings.lastSync = Date.now();
    _Astamp = -1; flush(); render();
  },
  schedule() {
    if (!S.settings.autoSync || !S.settings.driveClientId) return;
    clearTimeout(this.t); this.t = setTimeout(() => { if (this.valid()) this.now(false); }, 4000);
  },
};

/* ===================== Files: CSV + JSON ===================== */
function pickFile(accept) {
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => res(i.files[0] || null); i.click(); });
}
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [';', '\t', ','].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
function parseDate(s) {
  s = String(s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return new Date(+m[1], m[2] - 1, +m[3], 12).getTime();
  if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/))) { const y = m[3].length === 2 ? 2000 + +m[3] : +m[3]; return new Date(y, m[2] - 1, +m[1], 12).getTime(); }
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) { let a = +m[1], b = +m[2]; const y = m[3].length === 2 ? 2000 + +m[3] : +m[3]; if (a > 12) [a, b] = [b, a]; return new Date(y, a - 1, b, 12).getTime(); }
  const t = Date.parse(s); return isNaN(t) ? null : startOfDay(t) + 12 * 3600000;
}
const numIn = s => num(String(s || '').replace(/[^\d.,-]/g, ''));
function importCSVText(text) {
  const rows = parseCSV(text); if (rows.length < 2) return 'Keine Daten gefunden.';
  const H = rows[0].map(h => h.toLowerCase());
  const col = (...keys) => H.findIndex(h => keys.some(k => h.includes(k)));
  const cD = col('date', 'datum', 'day', 'tag', 'time', 'zeit');
  const cW = col('weight', 'gewicht'), cF = col('body fat', 'körperfett', 'fett', 'fat');
  const cR = col('recovery', 'erholung'), cH = col('hrv'), cS = col('sleep score', 'sleep', 'schlaf');
  if (cD < 0) return 'Keine Datumsspalte erkannt.';
  let nb = 0, nr = 0;
  const bodyDays = new Set(S.body.map(b => dayKey(b.t))), recDays = new Set(S.recovery.map(r => dayKey(r.t)));
  for (const r of rows.slice(1)) {
    const t = parseDate(r[cD]); if (!t) continue; const k = dayKey(t);
    if (cW >= 0) { const w = numIn(r[cW]); if (w > 30 && w < 300 && !bodyDays.has(k)) { const f = cF >= 0 ? numIn(r[cF]) : NaN; S.body.push({ t, w, ...(f > 2 && f < 70 ? { fat: f } : {}) }); bodyDays.add(k); nb++; } }
    if (cR >= 0 || cH >= 0) { const sc = cR >= 0 ? numIn(r[cR]) : NaN; if (sc >= 0 && sc <= 100 && !recDays.has(k)) { const h = cH >= 0 ? numIn(r[cH]) : NaN, sl = cS >= 0 ? numIn(r[cS]) : NaN; S.recovery.push({ t, score: Math.round(sc), ...(h > 0 ? { hrv: Math.round(h) } : {}), ...(sl > 0 ? { sleep: Math.round(sl) } : {}) }); recDays.add(k); nr++; } }
  }
  save();
  if (!nb && !nr) return 'Nichts Neues gefunden. Spalten für Gewicht oder Erholung fehlen, oder alle Tage sind schon da.';
  return [nb ? nb + ' Messungen' : '', nr ? nr + ' Erholungswerte' : ''].filter(Boolean).join(' und ') + ' importiert.';
}
async function importCsv() { const f = await pickFile('.csv,text/csv,text/plain'); if (!f) return; toast(importCSVText(await f.text())); render(); }
function exportJson() {
  const blob = new Blob([JSON.stringify({ ...S, draft: null }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'murmel-backup-' + dayKey(Date.now()) + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importJson() {
  const f = await pickFile('.json,application/json'); if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d || !Array.isArray(d.sessions)) throw 0; S = migrate(d); S.updatedAt = Date.now(); _Astamp = -1; save(); closeOverlay(); toast('Backup geladen'); }
  catch (e) { toast('Diese Datei ist kein Murmel-Backup'); }
}

  calDay: el => { const d = +el.dataset.d, a = S.settings.calDays || []; S.settings.calDays = a.includes(d) ? a.filter(x => x !== d) : a.concat(d); save(); settingsView(); },
  csvTraining: () => csvTraining(), csvBody: () => csvBody(),
  askRestore: el => confirmSheet('Stand vom ' + fmtDate(fromKey(el.dataset.k.slice(5)), true) + ' wiederherstellen? Neuere Änderungen gehen verloren.', 'Wiederherstellen', 'restore', { k: el.dataset.k }, true),
  restore: el => Backup.restore(el.dataset.k),
  saveDb: () => { const a = $('#dbW').value.trim().split(/[\s;]+/).map(num).filter(v => v > 0).sort((x, y) => x - y); if (!a.length) return toast('Bitte Gewichte eintragen'); S.settings.dbW = [...new Set(a)]; save(); settingsView(); toast(a.length + ' Gewichte gespeichert'); },
  daySS: el => { const a = S.days[el.dataset.day], j = +el.dataset.j, x = a[j];
    if (x.ss) { const tag = x.ss; a.forEach(y => { if (y.ss === tag) delete y.ss; }); }
    else if (a[j + 1]) { const tag = 's' + uid().slice(-4); x.ss = tag; a[j + 1].ss = tag; } else return toast('Supersatz braucht eine Übung darunter');
    save(); settingsView(); },

  pickDay: () => pickDaySheet(),
  openSess: () => openSession(),
  minSess: () => minimizeSession(),
  done: el => toggleDone(+el.dataset.i, +el.dataset.j, !!el.dataset.warm),
  step: el => {
    const i = +el.dataset.i, j = +el.dataset.j, f = el.dataset.f, d = +el.dataset.d, warm = !!el.dataset.warm, e = S.draft.ex[i], ex = S.exercises[e.id], s = (warm ? e.warm : e.sets)[j];
    const cur = num(s[f]) || 0;
    const v = f === 'w' ? nextW(ex, cur, d) : Math.max(0, cur + d * (isTime(ex) ? 5 : 1));
    const rewarm = setVal(i, j, f, v, true, warm);
    if (rewarm) refreshCard(cardOf(i));
    else {
      const wa = warm ? '[data-warm="1"]' : ':not([data-warm])';
      (warm ? e.warm : e.sets).forEach((x, k) => { const inp = $(`#sess input[data-in="${f}"][data-i="${i}"][data-j="${k}"]${wa}`); if (inp) inp.value = x[f] === '' ? '' : String(x[f]).replace('.', ','); });
      renderDock();
    }
    buzz(6);
  },
  addSet: el => { const e = S.draft.ex[+el.dataset.i], l = e.sets[e.sets.length - 1] || { w: 0, r: S.exercises[e.id].min }; e.sets.push({ w: l.w, r: l.r, done: false }); save(); refreshCard(cardOf(+el.dataset.i)); },
  plank: el => { const i = +el.dataset.i, j = +el.dataset.j, s = S.draft.ex[i].sets[j]; Timer.plank(i, j, num(s.r) || S.exercises[S.draft.ex[i].id].min); },
  tAdd: el => { Timer.end += (+el.dataset.d) * 1000; Timer.draw(); },
  tStop: () => Timer.stop(),
  tCancel: () => Timer.stop(),
  tHold: () => { const [i, j] = Timer.ij, held = Math.round((Date.now() - Timer.start) / 1000); Timer.stop(); const s = S.draft.ex[i].sets[j]; s.r = held; s.done = false; toggleDone(i, j); },
  exMenu: el => { const i = +el.dataset.i, e = S.draft.ex[i]; sheet(`<h2>${esc(S.exercises[e.id].name)}</h2><div class="list" style="margin-top:12px">
    <button class="li" data-act="exNote" data-i="${i}">Notiz${e.note ? ' bearbeiten' : ' hinzufügen'}</button>
    <button class="li" data-act="delSet" data-i="${i}">Letzten Satz entfernen</button>
    <button class="li" data-act="swapEx" data-i="${i}">Übung tauschen</button>
    <button class="li" data-act="moveEx" data-i="${i}" data-d="-1">Nach oben</button>
    <button class="li" data-act="moveEx" data-i="${i}" data-d="1">Nach unten</button>
    <button class="li" data-act="exDetail" data-id="${e.id}">Verlauf ansehen</button>
    <button class="li" data-act="rmEx" data-i="${i}" style="color:var(--bad)">Aus dieser Einheit entfernen</button></div>`); },
  exNote: el => { const i = +el.dataset.i; sheet(`<h2>Notiz</h2><textarea class="f" rows="3" id="exNoteTxt" style="margin-top:12px" placeholder="z. B. Sitzposition 4, Ellbogen eng">${esc(S.draft.ex[i].note || '')}</textarea><button class="btn pri wide" style="margin-top:12px" data-act="saveExNote" data-i="${i}">Speichern</button>`); setTimeout(() => $('#exNoteTxt') && $('#exNoteTxt').focus(), 250); },
  saveExNote: el => { const i = +el.dataset.i; S.draft.ex[i].note = $('#exNoteTxt').value.trim(); save(); closeSheet(); refreshCard(cardOf(i)); },
  delSet: el => { const i = +el.dataset.i, e = S.draft.ex[i]; if (e.sets.length > 1) e.sets.pop(); save(); closeSheet(); refreshCard(cardOf(i)); },
  swapEx: el => exPicker('swap', +el.dataset.i),
  addEx: () => exPicker('add'),
  moveEx: el => { const i = +el.dataset.i, d = +el.dataset.d, a = S.draft.ex, k = i + d; if (k < 0 || k >= a.length) return closeSheet(); [a[i], a[k]] = [a[k], a[i]]; save(); closeSheet(); renderSession(); },
  rmEx: el => { S.draft.ex.splice(+el.dataset.i, 1); save(); closeSheet(); renderSession(); },
  pickEx: el => {
    const { mode, id } = el.dataset, i = el.dataset.i === '' ? null : +el.dataset.i;
    if (mode === 'day') { const day = el.dataset.day; if (!S.days[day].some(x => x.id === id)) S.days[day].push({ id, sets: S.exercises[id].sets }); save(); closeSheet(); settingsView(); return; }
    const before = S.draft.editOf ? S.draft.start : undefined;
    if (mode === 'swap') S.draft.ex[i] = buildEx(id, before); else S.draft.ex.push(buildEx(id, before));
    save(); closeSheet(); renderSession();
    if (mode === 'add') setTimeout(() => goCard(FX.cards.length - 1), 80);
  },
  newEx: el => exEditSheet(null, { mode: el.dataset.mode, i: el.dataset.i, day: el.dataset.day }),
  editEx: el => exEditSheet(el.dataset.id),
  saveEx: el => {
    const name = $('#exName').value.trim(); if (!name) return toast('Bitte einen Namen eingeben');
    let id = el.dataset.id;
    const min = Math.max(1, num($('#exMin').value) || 1), max = Math.max(min, num($('#exMax').value) || min);
    const data = { name, muscle: $('#exMus').value, kind: $('#exKind').value, sets: clamp(Math.round(num($('#exSets').value) || 3), 1, 10), min, max, inc: num($('#exInc').value) || 2, rest: clamp(Math.round(num($('#exRest').value) || 90), 15, 600), equip: $('#exEq').value, how: ($('#exHow') ? $('#exHow').value.trim() : '') };
    if (!id) { id = 'x' + uid(); S.exercises[id] = { id, ...data }; } else Object.assign(S.exercises[id], data);
    save(); closeSheet();
    const { mode } = el.dataset, i = el.dataset.i === '' ? null : +el.dataset.i;
    if (mode === 'add' || mode === 'swap') ACT.pickEx({ dataset: { mode, id, i: i ?? '' } });
    else if (mode === 'day') ACT.pickEx({ dataset: { mode, id, day: el.dataset.day } });
    else if ($('#over').classList.contains('show')) settingsView(); else render();
    toast('Übung gespeichert');
  },
  sessMenu: () => sheet(`<h2>Einheit</h2><div class="list" style="margin-top:12px"><button class="li" data-act="addEx">Übung hinzufügen</button><button class="li" data-act="finish">${S.draft.editOf ? 'Speichern' : 'Jetzt beenden'}</button><button class="li" data-act="askDiscard" style="color:var(--bad)">${S.draft.editOf ? 'Bearbeitung verwerfen' : 'Einheit verwerfen'}</button></div>`),
  askDiscard: () => confirmSheet(S.draft.editOf ? 'Änderungen verwerfen?' : 'Diese Einheit komplett verwerfen?', 'Verwerfen', 'discard', {}, true),
  discard: () => { S.draft = null; Timer.stop(); save(); closeSheet(); minimizeSession(); },
  finish: () => finishSession(false),
  finishForce: () => finishSession(true),
  sessDetail: el => sessDetailSheet(el.dataset.id),
  exDetail: el => exDetailSheet(el.dataset.id),
  editSess: el => {
    if (S.draft) return toast('Beende zuerst die laufende Einheit');
    const s = S.sessions.find(x => x.id === el.dataset.id);
    S.draft = { ...JSON.parse(JSON.stringify(s)), editOf: s.id }; S.draft.ex.forEach(e => e.rest = (S.exercises[e.id] || {}).rest);
    FX.cur = 0; save(); closeSheet(); openSession();
  },
  askDelSess: el => confirmSheet('Diese Einheit löschen? Glanz und Rekorde werden neu berechnet.', 'Löschen', 'delSess', { id: el.dataset.id }, true),
  delSess: el => { S.sessions = S.sessions.filter(s => s.id !== el.dataset.id); save(); seenSync(); closeSheet(); render(); toast('Gelöscht'); },
  addWeight: () => weightSheet(),
  saveWeight: () => {
    const w = num($('#bw').value), f = num($('#bf').value), wa = num($('#bwa').value), t = fromKey($('#bd').value || dayKey(Date.now())) + 12 * 3600000;
    const okW = w > 30 && w < 300, okWa = wa > 40 && wa < 200;
    if (!okW && !okWa) return toast('Bitte Gewicht oder Taille eingeben');
    if (okW) { S.body = S.body.filter(b => dayKey(b.t) !== dayKey(t)); S.body.push({ t, w, ...(f > 2 && f < 70 ? { fat: f } : {}) }); }
    if (okWa) { S.waist = S.waist.filter(x => dayKey(x.t) !== dayKey(t)); S.waist.push({ t, cm: wa }); }
    save(); closeSheet(); render(); toast('Messung gespeichert');
  },
  delBody: el => confirmSheet('Messung vom ' + fmtDate(+el.dataset.t, true) + ' löschen?', 'Löschen', 'delBodyOk', { t: el.dataset.t }, true),
  delBodyOk: el => { S.body = S.body.filter(b => b.t !== +el.dataset.t); save(); closeSheet(); render(); },
  addRec: () => recSheet(),
  saveRec: () => {
    const sc = num($('#rs').value), h = num($('#rh').value), sl = num($('#rl').value), t = fromKey($('#rd').value || dayKey(Date.now())) + 12 * 3600000;
    if (!(sc >= 0 && sc <= 100)) return toast('Erholung zwischen 0 und 100 eingeben');
    S.recovery = S.recovery.filter(r => dayKey(r.t) !== dayKey(t)); S.recovery.push({ t, score: Math.round(sc), ...(h > 0 ? { hrv: Math.round(h) } : {}), ...(sl > 0 ? { sleep: Math.round(sl) } : {}) });
    save(); closeSheet(); render(); toast('Erholung gespeichert');
  },
  cardio: () => cardioSheet(),
  cKind: el => { $$('#cSeg button').forEach(b => b.classList.toggle('on', b === el)); $('#cSave').dataset.kind = el.dataset.v; const A = el.dataset.v === 'A'; $('#cm').value = A ? 25 : 28; $('#ci').value = A ? '5,5' : '9'; },
  saveCardio: el => {
    const m = num($('#cm').value), inc = num($('#ci').value), sp = num($('#cs').value), d = $('#cd').value || dayKey(Date.now());
    if (!(m > 0)) return toast('Bitte die Minuten eintragen');
    const t = d === dayKey(Date.now()) ? Date.now() : fromKey(d) + 18 * 3600000;
    S.cardio.push({ id: uid(), t, kind: el.dataset.kind, min: m, incl: inc || 0, ...(sp > 0 ? { speed: sp } : {}) });
    save(); closeSheet(); render(); toast('Laufband gespeichert, +15 Glanz');
  },
  delCardio: el => confirmSheet('Laufband-Eintrag löschen?', 'Löschen', 'delCardioOk', { id: el.dataset.id }, true),
  delCardioOk: el => { S.cardio = S.cardio.filter(c => c.id !== el.dataset.id); save(); closeSheet(); render(); },
  importCsv: () => importCsv(),
  exportJson: () => exportJson(),
  importJson: () => importJson(),
  askReset: () => confirmSheet('Wirklich alle Daten auf diesem Gerät löschen? Exportiere vorher ein Backup.', 'Alles löschen', 'reset', {}, true),
  reset: () => { const keep = S.settings.driveClientId; S = defaultState(); S.settings.driveClientId = keep; _Astamp = -1; save(); closeSheet(); closeOverlay(); toast('Zurückgesetzt'); },
  daySets: el => { const x = S.days[el.dataset.day][+el.dataset.j]; x.sets = x.sets >= 5 ? 1 : x.sets + 1; save(); settingsView(); },
  rampStart: () => { S.ramp = { start: Date.now() }; save(); settingsView(); toast('Comeback-Modus gestartet'); },
  rampEnd: () => { S.ramp = { start: 0 }; save(); settingsView(); toast('Comeback-Modus beendet'); },
  toggle: el => { const k = el.dataset.k; S.settings[k] = !S.settings[k]; save(); settingsView(); },
  dayAdd: el => { const day = el.dataset.day; const by = Object.values(S.exercises).filter(e => !S.days[day].some(x => x.id === e.id)); sheet(`<h2>Übung zu ${DAYMETA[day].name}</h2><div class="list" style="margin-top:12px">${by.map(e => `<button class="li" data-act="pickEx" data-mode="day" data-day="${day}" data-id="${e.id}"><span class="grow">${esc(e.name)}</span><span class="mu sm">${e.muscle}</span></button>`).join('')}</div><button class="btn ghost wide" style="margin-top:16px" data-act="newEx" data-mode="day" data-day="${day}">Neue Übung anlegen</button>`); },
  dayMove: el => { const a = S.days[el.dataset.day], j = +el.dataset.j, k = j + (+el.dataset.d); if (k < 0 || k >= a.length) return; [a[j], a[k]] = [a[k], a[j]]; save(); settingsView(); },
  dayDel: el => { S.days[el.dataset.day].splice(+el.dataset.j, 1); save(); settingsView(); },
  syncNow: () => Sync.now(true),
  syncAdopt: async () => { closeSheet(); try { const r = await Sync.pull(); if (r) { Sync.adopt(r); toast('Drive-Stand geladen'); } } catch (e) { toast('Laden fehlgeschlagen'); } },
  saveKey: () => { const v = $('#apiKey').value.trim(); if (v) localStorage.setItem('murmel:apikey', v); else localStorage.removeItem('murmel:apikey'); toast(v ? 'Schlüssel gespeichert' : 'Schlüssel entfernt'); },
  diary: () => writeDiary(),
};

/* ===================== Init ===================== */
function bind() {
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]'); if (!el) return;
    if (el.closest('#sheet .scrim')) return;
    const f = ACT[el.dataset.act]; if (f) { ev.preventDefault(); f(el, ev); }
  });
  $('#sheet .scrim').addEventListener('click', closeSheet);
  document.addEventListener('change', ev => {
    const el = ev.target;
    if (el.dataset.in && S.draft && el.dataset.in !== 'snote') {
      const i = +el.dataset.i, j = +el.dataset.j, f = el.dataset.in, v = num(el.value), warm = !!el.dataset.warm;
      const rewarm = setVal(i, j, f, isNaN(v) ? '' : v, true, warm);
      if (rewarm) refreshCard(cardOf(i));
      else if (f === 'w' && !warm) S.draft.ex[i].sets.forEach((x, k) => { const inp = $(`#sess input[data-in="w"][data-i="${i}"][data-j="${k}"]:not([data-warm])`); if (inp && k !== j) inp.value = x.w === '' ? '' : String(x.w).replace('.', ','); });
      renderDock();
    }
    if (el.dataset.set) { const k = el.dataset.set; S.settings[k] = el.dataset.num ? (num(el.value) || S.settings[k]) : el.value.trim(); save(); }
  });
  document.addEventListener('input', ev => { const el = ev.target; if (el.dataset.in === 'snote' && S.draft) { S.draft.note = el.value; save(); } });
  document.addEventListener('focusin', ev => { if (ev.target.matches && ev.target.matches('.step input')) setTimeout(() => ev.target.select(), 0); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && $('#sess').classList.contains('show')) lockScreen(true); });
}
async function init() {
  await loadState();
  bind(); render(); Backup.daily();
  if (S.draft && !S.draft.editOf && Date.now() - S.draft.start < 4 * 3600000) openSession();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => { });
  window.__murmel = { get S() { return S; }, set S(v) { S = v; }, analyze, suggest, cycleState, render, ACT, importCSVText, rankFor, Timer, invalidate: () => { _Astamp = -1; }, rampInfo, deloadInfo, nextW, snapW, recapData, Story, Guide, FX };
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
